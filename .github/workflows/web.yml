name: Web app (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Pages sert le site dans /<nom du dépôt>/ : la base doit être ajustée avant la publication
      # (le service worker vérifie l'intégrité de index.html, il ne faut pas le modifier après).
      - name: Base de l'URL
        run: sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' src/DictMe.Web/wwwroot/index.html

      - name: Publier la web app
        run: dotnet publish src/DictMe.Web/DictMe.Web.csproj -c Release -o out

      - name: Préparer GitHub Pages
        run: |
          touch out/wwwroot/.nojekyll
          cp out/wwwroot/index.html out/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
